[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exword-screen-capture-cli"
version = "1.0.0"
description = "Headless projector-mode capture for CASIO EX-word"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "ToTo-40417"}]
dependencies = ["pyusb==1.3.1"]

[project.optional-dependencies]
gui = ["PySide6-Essentials==6.8.3"]

[project.scripts]
exword-capture = "exword_capture.cli:main"

[project.gui-scripts]
exword-capture-gui = "exword_capture.entrypoints:gui"

[tool.setuptools]
packages = ["exword_capture"]

[tool.setuptools.package-data]
exword_capture = []
